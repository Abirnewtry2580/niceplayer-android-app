name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, player-controls-speech-waveform, player-lightweight-offline-features]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx cap sync android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: chmod +x android/gradlew
      - run: ./gradlew assembleRelease
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: NicePlayer-ARM64
          path: android/app/build/outputs/apk/release/app-arm64-v8a-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NicePlayer-ARM32
          path: android/app/build/outputs/apk/release/app-armeabi-v7a-release.apk
